<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>SSX 3</title><meta name="theme-color" content="#0b0c0e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SSX 3"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="/mobile-icon-180.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/mobile.css"><script>/* QA (?perf=1, profiling scripts): frame times, long gaps, errors and screen changes, recorded before any module loads */if(/[?&]perf=1/.test(location.search)){const P=window.__perf={t0:performance.now(),frames:[],errors:[],screens:[]};let last=performance.now(),screen='';const loop=t=>{P.frames.push([Math.round(t),+(t-last).toFixed(1)]);last=t;const s=document.getElementById('stage')?.dataset.screen||'';if(s!==screen){screen=s;P.screens.push([Math.round(t),s]);}requestAnimationFrame(loop);};requestAnimationFrame(loop);addEventListener('error',e=>P.errors.push(String(e.message||e.error)));addEventListener('unhandledrejection',e=>P.errors.push('rejection: '+String(e.reason?.stack||e.reason)));const ce=console.error.bind(console),cw=console.warn.bind(console);console.error=(...a)=>{P.errors.push('error: '+a.map(String).join(' ').slice(0,300));ce(...a);};console.warn=(...a)=>{P.errors.push('warn: '+a.map(String).join(' ').slice(0,300));cw(...a);};}</script></head><body><div id="stage"><canvas id="ui-bg" width="640" height="448"></canvas><canvas id="game"></canvas><canvas id="ui" width="640" height="448"></canvas><nav id="game-menu" aria-label="Game menu"></nav></div><script type="module" src="/main.js"></script></body></html>
